name: VistaJet LMML watch

on:
  schedule:
    # Run every hour. The script checks Malta local time and only does real
    # work at 07:00, 12:00, and 15:00 anyway, so this just ensures we don't
    # miss those windows due to cron timing issues.
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the workflow can commit updated data back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_RECIPIENT_NUMBER: ${{ secrets.WHATSAPP_RECIPIENT_NUMBER }}
        run: python vistajet_lmml_watch.py

      - name: Persist state
        run: |
          git config user.name "vistajet-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in seen_flights.json docs/data.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Update watch data"
            git push
          fi
