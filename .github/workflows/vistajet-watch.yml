name: VistaJet LMML watch

on:
  schedule:
    # Malta is CET (UTC+1) in winter and CEST (UTC+2) in summer.
    # We fire at BOTH possible UTC times for each local target hour;
    # the script checks true Malta local time and no-ops the "wrong" one,
    # so this self-adjusts across the DST switch without edits twice a year.
    - cron: '0 6 * * *'   # 07:00 Malta time (CET / winter)
    - cron: '0 5 * * *'   # 07:00 Malta time (CEST / summer)
    - cron: '0 11 * * *'  # 12:00 Malta time (CET / winter)
    - cron: '0 10 * * *'  # 12:00 Malta time (CEST / summer)
    - cron: '0 14 * * *'  # 15:00 Malta time (CET / winter)
    - cron: '0 13 * * *'  # 15:00 Malta time (CEST / summer)
  workflow_dispatch: {}    # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit updated data back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_RECIPIENT_NUMBER: ${{ secrets.WHATSAPP_RECIPIENT_NUMBER }}
        run: python vistajet_lmml_watch.py

      - name: Persist state
        run: |
          git config user.name "vistajet-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          # Only stage files that actually exist - a manual test run outside
          # the 07:00/12:00/15:00 window, or a real check with nothing new,
          # can legitimately produce no seen_flights.json update. Trying to
          # `git add` a file that isn't there is what caused the earlier
          # "pathspec did not match any files" failure.
          for f in seen_flights.json docs/data.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Update watch data"
            git push
          fi
