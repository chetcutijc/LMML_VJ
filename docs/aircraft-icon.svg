<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0A0C0E" stroke="#C4142A" stroke-width="2"/>
  
  <!-- Fuselage (body) -->
  <ellipse cx="100" cy="100" rx="20" ry="55" fill="#C9CDD3" stroke="#C4142A" stroke-width="1.5"/>
  
  <!-- Cockpit -->
  <circle cx="100" cy="55" r="8" fill="#E8A33D" stroke="#C4142A" stroke-width="1"/>
  
  <!-- Wings -->
  <path d="M 80 95 L 30 90 L 35 100 L 80 105 Z" fill="#C9CDD3" stroke="#C4142A" stroke-width="1.5"/>
  <path d="M 120 95 L 170 90 L 165 100 L 120 105 Z" fill="#C9CDD3" stroke="#C4142A" stroke-width="1.5"/>
  
  <!-- Tail stabilizer (vertical) -->
  <path d="M 95 150 L 92 175 L 100 172 L 108 175 L 105 150 Z" fill="#C9CDD3" stroke="#C4142A" stroke-width="1.5"/>
  
  <!-- Tail wing (horizontal) -->
  <path d="M 85 155 L 65 162 L 70 167 L 90 162 Z" fill="#C4142A" opacity="0.6"/>
  <path d="M 115 155 L 135 162 L 130 167 L 110 162 Z" fill="#C4142A" opacity="0.6"/>
